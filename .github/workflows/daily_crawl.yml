name: Daily Crawl - Nara Market

on:
  schedule:
    # 매일 한국 시간 오전 7시 (UTC 22:00)
    - cron: "0 22 * * *"
  workflow_dispatch:  # 수동 실행 가능

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt urllib3

      - name: Run crawler
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_NAME: ${{ vars.SPREADSHEET_NAME || 'Rainmaker_DB' }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          cd crawler
          # SERVICE_ACCOUNT_JSON (base64): service_account.json 생성
          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            echo "$SERVICE_ACCOUNT_JSON" | base64 -d > "$GITHUB_WORKSPACE/service_account.json"
            export SERVICE_ACCOUNT_PATH="$GITHUB_WORKSPACE/service_account.json"
          fi
          python main.py
        continue-on-error: false
